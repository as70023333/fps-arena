<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Lockdown - 1v1 FPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="top-bar">
      <h1>ARENA LOCKDOWN</h1>
      <p>Arrow keys to move/turn. Spacebar to fire. Esc ends a round. R starts next round.</p>
      <div class="score-strip" aria-live="polite">
        <span id="roundText">Round 1</span>
        <span id="scoreText">You 0 - 0 CPU</span>
        <span id="matchText">First to 3</span>
        <span id="ammoText">Ammo 10/10</span>
      </div>
    </header>

    <main>
      <div id="gameContainer"></div>

      <div class="hud" aria-live="polite">
        <div class="panel">
          <span class="label">Player</span>
          <div class="bar-shell">
            <div id="playerHealthBar" class="bar player"></div>
          </div>
          <span id="playerHealthText" class="value">100</span>
        </div>

        <div class="panel">
          <span class="label">Opponent</span>
          <div class="bar-shell">
            <div id="enemyHealthBar" class="bar enemy"></div>
          </div>
          <span id="enemyHealthText" class="value">100</span>
        </div>
      </div>

      <div class="reticle" aria-hidden="true"></div>

      <div id="statusOverlay" class="status-overlay hidden">
        <div class="card">
          <h2 id="statusTitle">Victory</h2>
          <p id="statusText">Press R to run it back.</p>
          <button id="restartButton" type="button">Restart Match</button>
        </div>
      </div>
    </main>

    <script type="module" src="./game.js"></script>
  </body>
</html>
